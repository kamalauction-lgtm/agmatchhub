name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders; real values are injected per environment.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      # The marketplace homepage is prerendered at build time and cannot reach
      # the placeholder host above. This flag, set ONLY here, lets that one page
      # build empty in CI (apps/www/src/lib/build-fallback.ts). A release build
      # never sets it, so an unreachable production database still fails the
      # build instead of shipping an empty catalogue.
      WWW_CI_PLACEHOLDER_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Check no secrets committed
        run: |
          # Match key-like VALUES, not mentions: a real publishable/secret key is a
          # long token after the prefix, and a committed env line has a non-space
          # value after "=". Prose such as "sb_secret_…" or "the
          # SUPABASE_SERVICE_ROLE_KEY= line" must not fail the build.
          if git grep -nE "sb_secret_[A-Za-z0-9_-]{8,}|SUPABASE_SERVICE_ROLE_KEY=[^[:space:]]" -- ':!*.env.example' ':!.github/workflows/ci.yml'; then
            echo "::error::Possible secret committed"; exit 1
          fi

  rls:
    # The RLS suite is the platform's strongest safety net: it must run against a
    # real Postgres with real policies. It targets the STAGING project, never
    # production. Without staging secrets configured it is skipped loudly rather
    # than silently passing — see docs/stage-a-audit-and-architecture.md §B.5 S4.
    runs-on: ubuntu-latest
    env:
      # Lifted to job env so the steps below can branch on presence: the
      # `secrets` context is not reliably available inside a step-level `if`.
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A skipped suite must not read as a pass. Without staging secrets the job
      # FAILS with a clear message: the RLS result is NOT TESTED, and the release
      # gate stays closed until the secrets exist (GitHub → Settings → Secrets)
      # or an independent, documented staging run is approved.
      - name: Fail when staging credentials are missing
        if: env.STAGING_SUPABASE_URL == ''
        run: |
          echo "::error::RLS suite NOT TESTED — staging Supabase secrets are not configured in this repository."
          echo "Configure STAGING_SUPABASE_URL, STAGING_DATABASE_URL, STAGING_SUPABASE_ANON_KEY, STAGING_SERVICE_ROLE_KEY and the TEST_* credentials as repository secrets."
          exit 1
      # The suite reads ONE file named by scripts/test.mjs (--env=staging →
      # packages/db/.env.staging). CI materialises that file from secrets so
      # the local and CI paths are identical and no test ever needs to know
      # whether it is in CI. The service-role key is required: the fixture
      # sweep and the fixture-agent helper use it.
      # The heredoc delimiter is QUOTED ('EOF') so the shell writes every value
      # literally. GitHub substitutes ${{ secrets.* }} into the script text
      # before bash runs; with an unquoted delimiter bash then expanded `$`,
      # backticks and backslashes inside a secret, and the staging database
      # password (which contains one) reached Postgres altered (28P01,
      # 10 Nov 2026).
      - name: Write packages/db/.env.staging from secrets
        if: env.STAGING_SUPABASE_URL != ''
        run: |
          cat > packages/db/.env.staging <<'EOF'
          DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.STAGING_SERVICE_ROLE_KEY }}
          TEST_RA_EMAIL=${{ secrets.TEST_RA_EMAIL }}
          TEST_RA_PASSWORD=${{ secrets.TEST_RA_PASSWORD }}
          TEST_SA_EMAIL=${{ secrets.TEST_SA_EMAIL }}
          TEST_SA_PASSWORD=${{ secrets.TEST_SA_PASSWORD }}
          TEST_LA_EMAIL=${{ secrets.TEST_LA_EMAIL }}
          TEST_LA_PASSWORD=${{ secrets.TEST_LA_PASSWORD }}
          TEST_MA_EMAIL=${{ secrets.TEST_MA_EMAIL }}
          TEST_MA_PASSWORD=${{ secrets.TEST_MA_PASSWORD }}
          TEST_ADMIN_EMAIL=${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD=${{ secrets.TEST_ADMIN_PASSWORD }}
          GHL_LIVE=false
          EOF
      - name: Run the suite against staging
        if: env.STAGING_SUPABASE_URL != ''
        run: npm test
